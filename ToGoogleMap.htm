<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>経緯度検索 - Google Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }
        .header {
            background: #333;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .input-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-search {
            background: #667eea;
            color: white;
        }
        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        .btn-clear:hover {
            background: #e0e0e0;
        }
        .info-box {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 4px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .result p {
            font-size: 13px;
            color: #555;
            margin: 5px 0;
        }
        .result a {
            color: #1976d2;
            text-decoration: none;
            word-break: break-all;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .error {
            background: #ffebee !important;
            border-left-color: #f44336 !important;
        }
        .error h3 {
            color: #c62828 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📍 経緯度検索ツール</h1>
            <p>経緯度を入力してGoogle Mapで表示</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <h2>入力フォーム</h2>
                
                <div class="input-group">
                    <label for="latitude">緯度 (Latitude)</label>
                    <input type="text" id="latitude" placeholder="例: 35.3691">
                </div>
                
                <div class="input-group">
                    <label for="longitude">経度 (Longitude)</label>
                    <input type="text" id="longitude" placeholder="例: 133.0445">
                </div>
                
                <div class="input-group">
                    <label for="bulkInput">または一括入力</label>
                    <textarea id="bulkInput" placeholder="例: 35.3691, 133.0445&#10;または&#10;35°22'08.8&quot;N, 133°02'40.0&quot;E"></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn-search" onclick="searchLocation()">🗺️ 地図を開く</button>
                    <button class="btn-clear" onclick="clearForm()">クリア</button>
                </div>
                
                <div class="info-box">
                    <strong>入力フォーマット:</strong><br>
                    ✓ 35.3691, 133.0445<br>
                    ✓ 35.3691°N, 133.0445°E<br>
                    ✓ 35°22'08.8"N, 133°02'40.0"E
                </div>
                
                <div class="result" id="result"></div>
            </div>
        </div>
    </div>

    <script>
        // 度分秒を10進数に変換
        function dmsToDecimal(dms) {
            const regex = /(\d+)°(\d+)'([\d.]+)"([NSEW])/;
            const match = dms.trim().match(regex);
            if (!match) return null;
            
            let [, deg, min, sec, dir] = match;
            let decimal = parseFloat(deg) + parseFloat(min) / 60 + parseFloat(sec) / 3600;
            
            if (dir === 'S' || dir === 'W') {
                decimal = -decimal;
            }
            return decimal;
        }

        // 検索実行
        function searchLocation() {
            let lat, lng;
            const latInput = document.getElementById('latitude').value.trim();
            const lngInput = document.getElementById('longitude').value.trim();
            const bulkInput = document.getElementById('bulkInput').value.trim();

            const resultDiv = document.getElementById('result');

            try {
                if (bulkInput) {
                    // 一括入力の処理
                    const parts = bulkInput.split(/[,，]/);
                    
                    if (parts.length >= 2) {
                        const latStr = parts[0].trim();
                        const lngStr = parts[1].trim();

                        // 度分秒形式の判定
                        if (latStr.includes('°')) {
                            lat = dmsToDecimal(latStr);
                        } else {
                            lat = parseFloat(latStr);
                        }

                        if (lngStr.includes('°')) {
                            lng = dmsToDecimal(lngStr);
                        } else {
                            lng = parseFloat(lngStr);
                        }
                    }
                } else if (latInput && lngInput) {
                    // 個別入力の処理
                    lat = parseFloat(latInput);
                    lng = parseFloat(lngInput);
                }

                if (!lat || !lng || isNaN(lat) || isNaN(lng)) {
                    showError('有効な経緯度を入力してください');
                    return;
                }

                if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                    showError('経緯度の範囲が不正です (緯度: -90〜90, 経度: -180〜180)');
                    return;
                }

                // Google Mapsを別タブで開く
                const mapsUrl = `https://maps.google.com/?q=${lat},${lng}&z=15`;
                window.open(mapsUrl, '_blank');

                // 結果を表示
                showResult(lat, lng);

            } catch (error) {
                showError('エラーが発生しました: ' + error.message);
            }
        }

        // 結果表示
        function showResult(lat, lng) {
            const resultDiv = document.getElementById('result');
            const mapsUrl = `https://maps.google.com/?q=${lat},${lng}&z=15`;
            resultDiv.className = 'result show';
            resultDiv.innerHTML = `
                <h3>✓ 検索完了</h3>
                <p><strong>緯度:</strong> ${lat.toFixed(6)}</p>
                <p><strong>経度:</strong> ${lng.toFixed(6)}</p>
                <p><strong>Google Maps URL:</strong><br><a href="${mapsUrl}" target="_blank">${mapsUrl}</a></p>
            `;
        }

        // エラー表示
        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show error';
            resultDiv.innerHTML = `
                <h3>✗ エラー</h3>
                <p>${message}</p>
            `;
        }

        // フォームクリア
        function clearForm() {
            document.getElementById('latitude').value = '';
            document.getElementById('longitude').value = '';
            document.getElementById('bulkInput').value = '';
            document.getElementById('result').className = 'result';
        }

        // Enterキー対応
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchLocation();
            }
        });
    </script>
</body>
</html>
